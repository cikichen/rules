# ==================== DNS 配置 ====================
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 180.184.1.1
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - tls://dot.pub
  fake-ip-filter:
    - rule-set:Private_Domain
    - rule-set:Lan_Domain
    - rule-set:Direct_Domain
    - rule-set:China_Domain
    - rule-set:China_YYDS_Domain
    # 阿里域名需真实 IP, 供 AND,(...,(GEOIP,CN)) 判定国内/海外
    - rule-set:Alibaba_Domain
    - +.miwifi.com
    - +.docker.io
    - +.market.xiaomi.com
    - +.push.apple.com

