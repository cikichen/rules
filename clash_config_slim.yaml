# ==================== 规则 ====================
rules:
  # === 直连规则 (最高优先级) ===
  - RULE-SET,Private_Domain,全球直连
  - RULE-SET,Private_IP,全球直连,no-resolve
  - RULE-SET,Lan_Domain,全球直连
  - RULE-SET,Lan_IP,全球直连,no-resolve
  # === 中转站 (需早于直连/阿里规则, 否则会被抢先命中) ===
  - RULE-SET,Relay,中转站

